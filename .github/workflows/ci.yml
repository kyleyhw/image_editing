name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (CPU-only torch)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check photostyle bench tools tests studio
      - name: Unit tests
        run: uv run pytest -q
