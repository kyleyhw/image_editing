[project]
name = "image-editing"
version = "0.1.0"
description = "Content-adaptive, editable photo styles: learn per-image parametric edits toward a target look from paired or unpaired examples."
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.16",
    "fastapi>=0.141.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-multipart>=0.0.29",
    "rawpy>=0.18",
    "requests>=2.31",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "streamlit>=1.30",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=5.17.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "playwright>=1.63.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
